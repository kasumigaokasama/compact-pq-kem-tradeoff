name: Reproduce research calculations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py' -v
      - run: python experiments/dawn_codec.py
      - run: python experiments/reproduce_dawn_dfr_model.py
      - run: python experiments/qc_entropy_frontier.py
      - run: python experiments/ring_structure.py
      - run: python experiments/toy_correlation.py
      - run: python experiments/check_reproduced_results.py
